<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">agent-workbench-runner</title>
  <desc id="desc">Front door for agent-workbench: classify each task into direct Codex-to-Claude collaboration or a high-risk managed runner path.</desc>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1A1F28" stroke-width="1"/>
    </pattern>
    <linearGradient id="panelGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12161D"/>
      <stop offset="100%" stop-color="#0B0D10"/>
    </linearGradient>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="380" rx="26" fill="#0B0D10"/>
  <rect x="1" y="1" width="1198" height="378" rx="25" fill="url(#grid)" opacity="0.55"/>
  <rect x="1" y="1" width="1198" height="378" rx="25" fill="none" stroke="#2A2F38" stroke-width="1.5"/>

  <!-- left title block -->
  <g id="title-block" transform="translate(56 48)">
    <rect x="0" y="0" width="118" height="28" rx="6" fill="#161B22" stroke="#2A2F38"/>
    <text x="14" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8B919A" letter-spacing="1.2">SKILL · FRONT DOOR</text>

    <text x="0" y="88" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="48" font-weight="700" fill="#F4F1EA">agent-workbench</text>
    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="48" font-weight="700" fill="#F4F1EA">-runner</text>

    <text x="0" y="190" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" fill="#C8CDD5">Classify first. Collaborate by default.</text>
    <text x="0" y="222" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" fill="#C8CDD5">Escalate only when controls matter.</text>

    <g transform="translate(0 258)">
      <rect x="0" y="0" width="168" height="32" rx="8" fill="#12231A" stroke="#2F6B4A"/>
      <circle cx="18" cy="16" r="5" fill="#7CDBA0"/>
      <text x="32" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7CDBA0">direct path</text>

      <rect x="180" y="0" width="196" height="32" rx="8" fill="#261C10" stroke="#8A5A20"/>
      <circle cx="198" cy="16" r="5" fill="#E8A54B"/>
      <text x="212" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#E8A54B">managed runner</text>
    </g>
  </g>

  <!-- right proof: classification gate -->
  <g id="project-proof" transform="translate(700 42)">
    <rect x="0" y="0" width="444" height="296" rx="18" fill="url(#panelGlow)" stroke="#2A2F38"/>

    <!-- header -->
    <text x="24" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8B919A" letter-spacing="1">CLASSIFICATION GATE</text>
    <text x="360" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5C6470">v1</text>

    <!-- invoke node -->
    <rect x="122" y="56" width="200" height="40" rx="10" fill="#161B22" stroke="#3A4250"/>
    <text x="222" y="81" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#F4F1EA">$agent-workbench-runner</text>

    <!-- connector down -->
    <path d="M222 96 V118" stroke="#3A4250" stroke-width="2"/>
    <circle cx="222" cy="124" r="5" fill="#F4F1EA"/>

    <!-- decision diamond simplified as chip -->
    <rect x="92" y="136" width="260" height="44" rx="12" fill="#1A1F28" stroke="#4A5260"/>
    <text x="222" y="163" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#F4F1EA">needs managed controls?</text>

    <!-- fork lines -->
    <path d="M130 180 V198 H70 V210" fill="none" stroke="#2F6B4A" stroke-width="2"/>
    <path d="M314 180 V198 H374 V210" fill="none" stroke="#8A5A20" stroke-width="2"/>

    <!-- left lane: direct -->
    <rect x="18" y="214" width="168" height="60" rx="12" fill="#12231A" stroke="#2F6B4A"/>
    <text x="102" y="240" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#7CDBA0">NO · DIRECT</text>
    <text x="102" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#C8CDD5">Codex ↔ Claude Code</text>

    <!-- right lane: managed -->
    <rect x="258" y="214" width="168" height="60" rx="12" fill="#261C10" stroke="#8A5A20"/>
    <text x="342" y="240" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#E8A54B">YES · MANAGED</text>
    <text x="342" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#C8CDD5">claude-delegate.ps1</text>
  </g>
</svg>
